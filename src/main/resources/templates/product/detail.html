<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>商品詳細</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/detail.css}">
	<link rel="stylesheet" th:href="@{/css/_header.css}">
</head>

<body>
	<header th:replace="layout/_header :: header"></header>

	<!-- 1段目：商品メインエリア（画像と基本情報） -->
	<div class="product-page">

		<!-- 左：サムネイル -->
		<div class="thumbnail-column">
			<img th:each="image : ${productImages}" th:src="@{${image.imagePath}}"
				th:data-image-path="@{${image.imagePath}}" class="thumbnail-image">
		</div>

		<!-- 中央：メイン画像 -->
		<div class="main-image-area">
			<img id="mainImage" th:src="@{${productImages[0].imagePath}}" class="main-image" alt="">
		</div>

		<!-- 右：商品情報 -->
		<div class="product-info">
			<h1 class="product-title" th:text="${product.name}">商品名</h1>

			<!-- レビュー（総合評価） -->
			<span class="stars" th:data-rating="${averageStar}"></span>

			<span th:text="${#numbers.formatDecimal(averageStar, 1, 1)}"></span>
			<span th:text="|(${product.reviewSum})|"></span>

			<!-- 価格 -->
			<div class="price-area">
				¥<span th:text="${product.price}"></span>
			</div>

			<!-- 在庫 -->
			<div class="stock-area">
				在庫数 : <span th:text="${product.stock}"></span>
			</div>

			<!-- ボタンエリア（カートとお気に入りを横並びに配置） -->
			<div class="action-buttons-container"
				style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">

				<!-- カート追加フォーム -->
				<form id="cartForm" style="display:inline; margin: 0;">
					<input type="hidden" name="productId" th:value="${product.id}" />
					<input type="hidden" name="imagePath" th:value="${productImages[0].imagePath}" />
					<button type="submit" class="cart-button">カートに追加</button>
				</form>

				<!-- お気に入りトグルフォーム（新規追加） -->
				<form th:action="@{/products/favorite/toggle}" method="post" style="display:inline; margin: 0;">
					<input type="hidden" name="productId" th:value="${product.id}" />

					<button type="submit"
						style="background: none; border: none; cursor: pointer; padding: 5px; outline: none;">
						<!-- お気に入り登録済みのとき（赤色の塗りつぶしハート） -->
						<i th:if="${isFavorite}" class="fa-solid fa-heart"
							style="color: #ff4d4d; font-size: 1.8rem;"></i>

						<!-- お気に入り未登録のとき（グレーの白抜きハート） -->
						<i th:unless="${isFavorite}" class="fa-regular fa-heart"
							style="color: #ccc; font-size: 1.8rem;"></i>
					</button>
				</form>

			</div>

<!--			 商品説明 -->
<!--			<div class="description-box">-->
<!--				北海道の厳選素材を使用した人気商品です。-->
<!--			</div>-->
		</div>

	</div>

	<div class="review-form-container">
		<div>

		</div>

		<h2 class="review-form-title" th:text="${myReview != null} ? 'レビューを編集する' : 'レビューを書く'">
			レビューを書く
		</h2>

		<!-- レビューを書くフォーム -->
		<form th:action="@{/products/reviews}" method="post">

			<!-- 商品ID -->
			<input type="hidden" name="productId" th:value="${product.id}">

			<!-- 星 -->
			<div>
				<label class="review-label">評価</label>
				<select name="star" class="review-select">
					<!-- myReviewのstarの値に応じて、自動的に selected が付与されます -->
					<option value="5" th:selected="${myReview != null && myReview.star == 5.0}">★★★★★</option>
					<option value="4" th:selected="${myReview != null && myReview.star == 4.0}">★★★★☆</option>
					<option value="3" th:selected="${myReview != null && myReview.star == 3.0}">★★★☆☆</option>
					<option value="2" th:selected="${myReview != null && myReview.star == 2.0}">★★☆☆☆</option>
					<option value="1" th:selected="${myReview != null && myReview.star == 1.0}">★☆☆☆☆</option>
				</select>
			</div>

			<!-- コメント -->
			<div>
				<label class="review-label">コメント</label>
				<!-- テキストエリアの間に th:text を挟みます。未投稿なら空になります -->
				<textarea name="description" class="review-textarea" placeholder="商品の感想を書いてください"
					th:text="${myReview?.description}"></textarea>
			</div>

			<!-- 投稿ボタン -->
			<button type="submit" class="review-submit-button">
				<!-- すでにレビューがある場合はボタンの文字を「更新する」に変えるとお親切です -->
				<span th:text="${myReview != null} ? '更新する' : '投稿する'">投稿する</span>
			</button>

		</form>

	</div>

	<!-- 2段目：カスタマーレビューエリア（画像や商品情報の下に独立して配置） -->
		<div class="container review-list-container" th:if="${not #lists.isEmpty(reviews)}">

			<!-- 区切り線 -->
			<hr class="review-divider">

			<h3 class="review-list-title">カスタマーレビュー</h3>

			<!-- レビュー一覧のコンテナ -->
			<div class="review-cards-wrapper">
				<!-- 各ユーザーのレビューをループ -->
				<div th:each="review : ${reviews}" class="review-card">
					<!-- ユーザー情報ヘッダー -->
					<div class="review-card-header">
						<div class="review-user-avatar">
							<i class="fa-solid fa-user"></i>
						</div>
						<div class="review-user-info">
							<span class="review-user-name" th:text="${review.user.name}">ユーザー名</span>
							<!-- もしレビューごとの星評価（数値）があれば、ここに配置するのもおすすめです -->
						</div>
					</div>
					<!-- レビュー本文 -->
					<p class="review-card-text" th:text="${review.description}">ここにレビューのコメントが入ります。</p>
				</div>
			</div>

		</div>

	<div id="toast" class="toast-message">
		カートに追加しました
	</div>

	<script th:src="@{/javascript/productdetail.js}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳細</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/detail.css}">
</head>

<body>

    <main class="main-container">

        <div class="container">

            <!-- 戻る -->
            <a href="/products" class="back-link">
                ← 商品一覧へ戻る
            </a>

            <!-- 商品カード -->
            <div class="detail-card">

                <!-- 商品画像 -->
                <img src="https://images.unsplash.com/photo-1563245372-f21724e3856d?q=80&w=1200"
                    class="detail-image">

                <!-- 商品情報 -->
                <div class="detail-body">

                    <div class="product-tag">
                        北海道グルメ
                    </div>

                    <!-- 商品名 -->
                    <h1 class="product-title"
                        th:text="${product.name}">
                        商品名
                    </h1>

                    <!-- 価格 -->
                    <div class="product-price">
                        ¥<span th:text="${product.price}"></span>
                    </div>

                    <!-- 詳細情報 -->
                    <div class="info-box">

                        <div class="info-item">

                            <div class="info-label">
                                商品ID
                            </div>

                            <div class="info-value"
                                th:text="${product.id}">
                            </div>

                        </div>

                        <div class="info-item">

                            <div class="info-label">
                                レビュー
                            </div>

                            <div class="info-value">
                                ⭐ <span th:text="${product.reviewStar}"></span>
                            </div>

                        </div>

                        <div class="info-item">

                            <div class="info-label">
                                在庫数
                            </div>

                            <div class="info-value"
                                th:text="${product.stock}">
                            </div>

                        </div>

                    </div>

                    <!-- ボタン -->
                    <button class="btn btn-warning buy-btn">
                        カートに追加する
                    </button>

                </div>

            </div>

        </div>

    </main>

</body>

</html>

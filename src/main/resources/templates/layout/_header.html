<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ごほうびほっかいどう</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="header.css">
</head>

<body>

    <!-- =========================
        HEADER
    ========================== -->
    <header class="main-header">

        <div class="container">

            <!-- 上段 -->
            <div class="header-top">

                <!-- ロゴ -->
                <a href="/" class="site-logo">
                    <!-- 画像差し替え用 -->
                    <img src="images/logo.png" alt="ごほうびほっかいどう">
                </a>

                <!-- ナビ -->
                <nav class="main-nav">

                    <a href="/">トップ</a>

                    <!-- ドロップダウン -->
                    <div class="nav-dropdown">

                        <a href="/products" class="dropdown-trigger">
                            商品一覧
                            <i class="bi bi-chevron-down"></i>
                        </a>

                        <div class="dropdown-menu-custom">

                            <a href="/products/agriculture">
                                <i class="bi bi-flower1"></i>
                                農作物
                            </a>

                            <a href="/products/seafood">
                                <i class="bi bi-water"></i>
                                海産物
                            </a>

                            <a href="/products/meat">
                                <i class="bi bi-egg-fried"></i>
                                肉・畜産品
                            </a>

                            <a href="/products/dairy">
                                <i class="bi bi-cup-hot"></i>
                                乳製品
                            </a>

                            <a href="/products/sweets">
                                <i class="bi bi-cake2"></i>
                                スイーツ・お菓子
                            </a>

                            <a href="/products/drink">
                                <i class="bi bi-cup-straw"></i>
                                酒・飲料
                            </a>

                            <a href="/products/daily">
                                <i class="bi bi-bag-heart"></i>
                                消耗品
                            </a>

                        </div>

                    </div>

                    <a href="/favorites">お気に入り一覧</a>

                    <a href="/cart">
                        カート
                        <i class="bi bi-cart3"></i>
                    </a>

                    <a href="/profile">プロフィール</a>

                </nav>

                <!-- 検索 -->
                <form class="header-search">

                    <input type="text" placeholder="商品を検索">

                    <button type="submit">
                        検索
                    </button>

                </form>

                <!-- ユーザー -->
                <a href="/mypage" class="header-user">

                    <!-- 画像差し替え用 -->
                    <div class="user-avatar">
                        <img src="images/job-icon.png" alt="職業アイコン">
                    </div>

                    <div class="user-level">
                        Lv. 10
                    </div>

                </a>

            </div>

        </div>

        <!-- 下段カテゴリ -->
        <div class="category-bar">

            <div class="container">

                <div class="category-list">

                    <a href="/products/agriculture" class="category-item">
                        <i class="bi bi-flower1"></i>
                        <span>農作物</span>
                    </a>

                    <a href="/products/seafood" class="category-item">
                        <i class="bi bi-water"></i>
                        <span>海産物</span>
                    </a>

                    <a href="/products/meat" class="category-item">
                        <i class="bi bi-egg-fried"></i>
                        <span>肉・畜産品</span>
                    </a>

                    <a href="/products/dairy" class="category-item">
                        <i class="bi bi-cup-hot"></i>
                        <span>乳製品</span>
                    </a>

                    <a href="/products/sweets" class="category-item">
                        <i class="bi bi-cake2"></i>
                        <span>スイーツ</span>
                    </a>

                    <a href="/products/drink" class="category-item">
                        <i class="bi bi-cup-straw"></i>
                        <span>酒・飲料</span>
                    </a>

                    <a href="/products/daily" class="category-item">
                        <i class="bi bi-bag-heart"></i>
                        <span>消耗品</span>
                    </a>

                </div>

            </div>

        </div>

    </header>

</body>

</html>

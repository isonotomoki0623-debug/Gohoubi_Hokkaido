<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>お気に入り一覧 - ごほうびほっかいどう</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

	<!-- Font Awesome（ハートマーク表示用） -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<link rel="stylesheet" th:href="@{/css/detail.css}">
	<link rel="stylesheet" th:href="@{/css/_header.css}">

	<style>
		body {
			font-family: 'Sawarabi Gothic', sans-serif;
			color: #222;
			min-height: 100vh;
			overflow-x: hidden;
			background-color: #f5faf4;
			background-image:
				url("data:image/svg+xml,%3Csvg width='220' height='220' viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cg opacity='0.07'%3E%3Ctext x='20' y='70' font-size='42'%3E🍃%3C/text%3E%3Ctext x='140' y='180' font-size='36'%3E🐄%3C/text%3E%3Ctext x='90' y='110' font-size='38'%3E⭐%3C/text%3E%3Ctext x='25' y='190' font-size='34'%3E🌽%3C/text%3E%3C/g%3E%3C/svg%3E"),
				linear-gradient(to bottom, #eef7ef 0%, #f7fbf6 45%, #fcfdfb 100%);
		}

		/* お気に入りカードの半透明＆ぼかし仕様 */
		.favorite-card {
			background: rgba(255, 255, 255, 0.92);
			backdrop-filter: blur(6px);
			border-radius: 28px;
			box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
			padding: 28px;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			border: none;
			transition: 0.25s;
		}

		.favorite-card:hover {
			transform: translateY(-6px);
			box-shadow: 0 16px 34px rgba(0, 0, 0, 0.1);
		}

		.main-container {
			padding: 42px 0 90px;
		}

		.section-title {
			font-family: 'Yusei Magic', sans-serif;
			font-size: 1.9rem;
			font-weight: bold;
			margin-bottom: 24px;
			color: #222;
			display: flex;
			align-items: center;
			gap: 10px;
		}
	</style>
</head>

<body>
	<header th:replace="layout/_header :: header"></header>

	<main class="main-container">
		<div class="container" style="max-width: 1500px;">

			<h2 class="section-title">
				❤️ お気に入り一覧
			</h2>

			<!-- お気に入りデータが空のときの表示 -->
			<div th:if="${#lists.isEmpty(products)}" class="favorite-card" style="text-align: center; padding: 50px;">
				<p style="margin: 0; font-size: 1.2rem; color: #666; font-weight: bold;">
					お気に入りに登録されている商品はありません。
				</p>
			</div>

			<!-- お気に入りデータが存在するときの表示 -->
			<div th:if="${not #lists.isEmpty(products)}" class="row g-4">

				<div th:each="product : ${products}" class="col-12 col-md-6 col-lg-4">

					<div class="favorite-card">

						<div>
							<!-- ★バッジ（左）とハート（右端）を配置するエリア -->
							<div
								style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">

								<!-- ステータスバッジ -->
								<div th:if="${product.stock > 0}" class="inline-block"
									style="display: inline-block; background: #eef8ef; color: #4f8f61; font-size: 0.8rem; font-weight: bold; border-radius: 999px; padding: 6px 12px; margin: 0;">
									お気に入り登録中
								</div>

								<!-- お気に入り解除フォーム（右端寄せ） -->
								<form th:action="@{/products/favorite/toggle}" method="post"
									style="margin: 0; display: flex; align-items: center;">
									<input type="hidden" name="productId" th:value="${product.id}" />

									<button type="submit"
										style="background: none; border: none; cursor: pointer; padding: 5px 0 5px 5px; outline: none; display: flex; align-items: center;"
										title="お気に入りを解除">
										<i class="fa-solid fa-heart" style="color: #ff4d4d; font-size: 1.6rem;"></i>
									</button>
								</form>

							</div>

							<!-- 商品名 -->
							<h3
								style="font-size: 1.4rem; font-family: 'Yusei Magic', sans-serif; margin-bottom: 15px; font-weight: bold;">
								<a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"
									style="color: #222; text-decoration: none;">
									商品名
								</a>
							</h3>

							<!-- 価格 -->
							<div style="font-size: 1.8rem; font-weight: bold; color: #f06b4f; margin-bottom: 10px;">
								<span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')} + '円'">0</span>
							</div>

							<!-- 在庫数 -->
							<div style="font-size: 0.95rem; color: #666; margin-bottom: 25px;">
								在庫数 : <span th:text="${product.stock}">0</span>
							</div>
						</div>

						<!-- 詳細画面へのリンクボタン -->
						<div>
							<a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-warning"
								style="width: 100%; border-radius: 999px; font-weight: bold; padding: 12px 18px; text-align: center; text-decoration: none; box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);">
								商品詳細を見る
							</a>
						</div>

					</div>

				</div>
			</div>
		</div>
	</main>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>注文完了</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/OrderCompleted.css}">
	<link rel="stylesheet" th:href="@{/css/_header.css}">
</head>

<body>
	<header th:replace="layout/_header :: header"></header>

	<div class="order-card shadow">
		<h1 class="order-title text-center">注文を完了しました</h1>

		<!-- 実績 -->
		<div class="mb-5">
			<span class="section-caption">実績解除</span>
			<div class="achievement-wrapper" th:if="${not #lists.isEmpty(achievements)}">
				<div th:each="achievement : ${achievements}" class="achievement-card">
					<div class="achievement-get">UNLOCK!</div>
					<div class="achievement-circle">
						<img th:src="@{${achievement.imagePath}}" th:alt="${achievement.name}">
					</div>
					<p class="achievement-name" th:text="${achievement.name}"></p>
					<p class="achievement-description" th:text="${achievement.description}"></p>
				</div>
			</div>
			<!-- 実績がない場合の枠 -->
			<div class="no-achievement-message" th:unless="${not #lists.isEmpty(achievements)}">
				新しく獲得した実績はありません
			</div>
		</div>

		<!-- スタンプ -->
		<div class="mb-5">
			<span class="section-caption">スタンプ獲得</span>
			<div class="stamp-wrapper" th:if="${not #lists.isEmpty(hokkaidoAreas)}">
				<div th:each="hokkaidoArea : ${hokkaidoAreas}" class="stamp-card">
					<div class="stamp-get">GET!</div>
					<div class="stamp-circle">
						<img th:src="@{${hokkaidoArea.imagePath}}" th:alt="${hokkaidoArea.name}">
					</div>
					<p class="stamp-name" th:text="${hokkaidoArea.name}"></p>
					<!-- 「エリア」の後に改行タグを追加 -->
					<p class="stamp-description" th:utext="${hokkaidoArea.name} + 'エリア<br>スタンプ獲得！'"></p>
				</div>
			</div>
			<!-- スタンプがない場合の枠 -->
			<div class="no-stamp-message" th:unless="${not #lists.isEmpty(hokkaidoAreas)}">
				新しく獲得したスタンプはありません
			</div>
		</div>

		<!-- レベルアップ -->
		<div class="mb-4">
			<span class="section-caption">レベルアップ</span>

			<!-- ここにスタンプ表示と同じ枠のクラス（例: no-stamp-message や 共通の枠クラス）を指定します -->
			<div class="level-up-section no-stamp-message" th:each="level : ${userLevel}">

				<!-- レベルが変わった場合の表示 -->
				<div class="level-text1" th:if="${level.nowLevel != level.upLevel}">
					Level
					<span style="color:#4f8f61" th:text="${level.nowLevel}">n</span>
					&rarr;
					<span style="color:#4f8f61" th:text="${level.upLevel}">n + 1</span>
				</div>

				<!-- レベルが変わらなかった場合の表示 -->
				<div class="level-text2" th:unless="${level.nowLevel != level.upLevel}">
					レベルアップしませんでした
				</div>

				<div class="next-level-info">
					次のレベルまであと
					<span class="highlight-price"
						th:text="${#numbers.formatInteger(level.remainAmount, 1, 'COMMA')} + '円'">0</span>
				</div>
			</div>
		</div>
		<!-- クーポン獲得ポップアップ -->
		<div class="coupon-popup-overlay" th:if="${not #lists.isEmpty(coupons)}" id="couponPopup">

			<div class="coupon-popup">

				<h2>クーポン獲得！</h2>
				<div class="coupon-list" th:classappend="${#lists.size(coupons) == 1} ? ' single' : ''">
					<div th:each="coupon : ${coupons}" class="popup-coupon-card">

						<div class="coupon-icon">
							🎫
						</div>

						<div class="coupon-info">

							<p class="coupon-name" th:text="${coupon.name}">
							</p>

							<p class="coupon-rate">
								割引率 :
								<span th:text="${#numbers.formatInteger(coupon.rate * 100, 0)}"></span>%
							</p>

						</div>

					</div>
				</div>

				<button class="popup-close-btn" onclick="closeCouponPopup()">

					閉じる

				</button>

			</div>

		</div>
		<script>

			function closeCouponPopup() {

				document
					.getElementById("couponPopup")
					.style.display = "none";
			}

		</script>
</body>

</html>

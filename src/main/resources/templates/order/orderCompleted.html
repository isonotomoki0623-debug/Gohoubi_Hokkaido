<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>注文完了</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet">

	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/OrderCompleted.css}">
	<link rel="stylesheet" th:href="@{/css/_header.css}">
</head>

<body>

	<header th:replace="layout/_header :: header"></header>

	<div class="order-card shadow">

		<h1 class="order-title text-center">
			注文を完了しました
		</h1>

		<!-- 実績 -->
		<div class="mb-5">

			<span class="section-caption">
				実績解除
			</span>

			<div class="achievement-wrapper">

				<div th:each="achievement : ${achievements}"
					class="achievement-card">

					<div class="achievement-get">
						UNLOCK!
					</div>

					<div class="achievement-circle">

						<img th:src="@{${achievement.imagePath}}"
							th:alt="${achievement.name}">

					</div>

					<p class="achievement-name"
						th:text="${achievement.name}">
					</p>

					<p class="achievement-description"
						th:text="${achievement.description}">
					</p>

				</div>

			</div>

		</div>

		<!-- スタンプ -->
		<div class="mb-5">

			<span class="section-caption">
				スタンプ獲得
			</span>

			<div class="stamp-wrapper">

				<div th:each="hokkaidoArea : ${hokkaidoAreas}"
					class="stamp-card">

					<div class="stamp-get">
						GET!
					</div>

					<div class="stamp-circle">

						<img th:src="@{${hokkaidoArea.imagePath}}"
							th:alt="${hokkaidoArea.name}">

					</div>

					<p class="stamp-name"
						th:text="${hokkaidoArea.name}">
					</p>

					<p class="stamp-description">
						北海道エリアスタンプ獲得！
					</p>

				</div>

			</div>

		</div>

		<!-- レベルアップ -->
		<div class="mb-4">

			<span class="section-caption">
				レベルアップ
			</span>

			<div class="level-up-section" th:each="level : ${userLevel}">

				<div class="level-text">

					Level
					<span style="color:#4f8f61" th:text="${level.nowLevel}">n</span>
					&rarr;
					<span style="color:#4f8f61" th:text="${level.upLevel}">n + 1</span>
					<span style="color:#4f8f61">
						n
					</span>

					&rarr;

					<span style="color:#4f8f61">
						n + 1
					</span>

				</div>

				<div class="next-level-info">

					次のレベルまであと
					<span class="highlight-price" th:text="${level.remainAmount}">

					<span class="highlight-price">
						ooooo円
					</span>

				</div>

			</div>

		</div>

	</div>

</body>

</html>

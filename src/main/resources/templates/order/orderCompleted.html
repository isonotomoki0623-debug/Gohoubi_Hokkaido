<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>注文完了</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/OrderCompleted.css}">
	<link rel="stylesheet" th:href="@{/css/_header.css}">
</head>

<body>

	<header th:replace="layout/_header :: header"></header>

	<div class="order-card shadow">

		<h1 class="order-title text-center mb-4">
			注文を完了しました
		</h1>

		<!-- 実績 -->
		<div class="mb-4">

			<span class="section-caption">
				実績解除
			</span>

			<div th:each="achievement : ${achievements}" class="achievement-banner">

				<span class="achievement-label">
					🏆 Achievement Unlocked!
				</span>

				<div class="achievement-content">

					<div class="achievement-image">
						<img th:src="@{${achievement.imagePath}}" th:alt="${achievement.name}">
					</div>

					<div class="achievement-info">

						<p class="achievement-name" th:text="${achievement.name}">
						</p>

						<p class="achievement-description" th:text="${achievement.description}">
						</p>

					</div>

				</div>

			</div>

		</div>

		<!-- スタンプ -->
		<div class="mb-4">

			<span class="section-caption">
				スタンプ獲得
			</span>

			<div th:each="hokkaidoArea : ${hokkaidoAreas}" class="achievement-banner">

				<span class="achievement-label">
					🏆 Achievement Unlocked!
				</span>

				<div class="achievement-content">

					<div class="achievement-image">
						<img th:src="@{${hokkaidoArea.imagePath}}" th:alt="${hokkaidoArea.name}">
					</div>

					<div class="achievement-info">

						<p class="achievement-name" th:text="${hokkaidoArea.name}">
						</p>

						<p class="achievement-description" th:text="${hokkaidoArea.name}">
						</p>

					</div>

				</div>

			</div>

		</div>

		<!-- レベルアップ -->
		<div class="mb-4">

			<span class="section-caption">
				レベルアップ
			</span>

			<div class="level-up-section" th:each="level : ${userLevel}">

				<div class="level-text">
					Level
					<span style="color:#4f8f61" th:text="${level.nowLevel}">n</span>
					&rarr;
					<span style="color:#4f8f61" th:text="${level.upLevel}">n + 1</span>
				</div>

				<div class="next-level-info">
					次のレベルまであと
					<span class="highlight-price" th:text="${level.remainAmount}">
						ooooo円
					</span>
				</div>

			</div>

		</div>

	</div>

</body>

</html>

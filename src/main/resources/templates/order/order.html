<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

    <div class="order-card">
        <h1 class="order-title">注文詳細</h1>
        <p class="order-date">注文日: 2024年05月15日</p>
        
        <div class="order-content-wrapper">
            <!-- 左側：商品リスト -->
            <div class="items-list">
                <div class="item-container">
                    <div class="item-image-box"><span>商品画像</span></div>
                    <div class="item-details">
                        <span class="product-name">新鮮ほうれん草パック</span>
                        <div class="price-info">単価：¥1,000 / 個数：3個</div>
                    </div>
                    <div class="item-price-total">¥3,000</div>
                </div>

                <div class="item-container">
                    <div class="item-image-box"><span>商品画像</span></div>
                    <div class="item-details">
                        <span class="product-name">特選和牛セット</span>
                        <div class="price-info">単価：¥12,000 / 個数：5個</div>
                    </div>
                    <div class="item-price-total">¥60,000</div>
                </div>
            </div>

            <!-- 右側：合計・確定 -->
            <div class="order-summary">
                <div class="total-section">
                    <div class="total-row">
                        <span style="font-size: 0.9rem; color: #666;">お支払い合計</span>
                        <span class="total-amount">¥63,000</span>
                    </div>
                    <p class="text-muted small" style="text-align: right;">(税込・送料込み)</p>
                    
                    <div class="confirm-btn-container">
                        <button class="login-btn">購入を確定する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

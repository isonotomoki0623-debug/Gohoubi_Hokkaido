<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文詳細</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>

<body>

<div class="order-card">

    <h1 class="order-title">
        注文詳細 （
        <span th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd')}">
            yyyy/MM/dd
        </span>
        ）
    </h1>

    <!-- 商品一覧 -->
    <div class="items-list">

        <div class="item-container" th:each="item : ${cart}">

            <img th:src="@{${item.imagePath}}"
                 alt="商品画像"
                 class="item-image-box">

            <div class="item-details">

                <div class="product-name"
                     th:text="'商品名 ' + ${item.name}">
                    商品名
                </div>

                <div>
                    単価
                    <span th:text="${#numbers.formatInteger(item.price, 1, 'COMMA')} + '円'">
                        1000円
                    </span>
                </div>

                <div>
                    個数
                    <span th:text="${item.quantity} + '個'">
                        3個
                    </span>
                </div>

                <div class="item-price-total"
                     th:text="'金額 ' + ${#numbers.formatInteger(item.price * item.quantity, 1, 'COMMA')} + '円'">
                    金額 3000円
                </div>

            </div>
        </div>
    </div>

    <!-- 合計 -->
    <div class="total-section">

        <span class="total-label">合計金額</span>

        <span class="total-amount"
              th:text="${#numbers.formatInteger(totalPrice, 1, 'COMMA')} + '円 (税込)'">
            63000円 (税込)
        </span>

    </div>

    <!-- クーポン -->
    <div class="coupon-section mt-4">

        <h5>クーポン選択</h5>

        <form th:action="@{/Comp}" method="get">

            <!-- クーポン使用有無 -->
            <div class="mb-3">

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           name="useCoupon"
                           id="useCouponYes"
                           value="true">

                    <label class="form-check-label" for="useCouponYes">
                        クーポンを使用する
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           name="useCoupon"
                           id="useCouponNo"
                           value="false"
                           checked>

                    <label class="form-check-label" for="useCouponNo">
                        クーポンを使用しない
                    </label>
                </div>

            </div>

            <!-- クーポン一覧 -->
            <div id="couponList" style="display:none;">

                <h6>利用可能クーポン</h6>

                <!-- 使用しない（初期値） -->
                <div class="form-check mb-2">
                    <input class="form-check-input"
                           type="radio"
                           name="couponId"
                           id="noCoupon"
                           value=""
                           checked>
                    <label class="form-check-label" for="noCoupon">
                        使用しない
                    </label>
                </div>

                <!-- クーポンリスト -->
                <div class="form-check mb-2"
                     th:each="coupon : ${couponList}">

                    <input class="form-check-input coupon-radio"
                           type="radio"
                           name="couponId"
                           th:id="'coupon-' + ${coupon.id}"
                           th:value="${coupon.id}"
                           disabled>

                    <label class="form-check-label"
                           th:for="'coupon-' + ${coupon.id}">

                        <span th:text="${coupon.name}">
                            500円OFFクーポン
                        </span>

                        （
                        <span th:text="${coupon.discount}">
                            500
                        </span>
                        円OFF）

                    </label>

                </div>
            </div>

            <!-- 確定ボタン -->
            <div class="confirm-btn-container mt-4">
                <button type="submit" class="login-btn">
                    購入を確定する
                </button>
            </div>

        </form>
    </div>

</div>

<!-- JS：表示制御 -->
<script>
    const useYes = document.getElementById("useCouponYes");
    const useNo = document.getElementById("useCouponNo");
    const couponList = document.getElementById("couponList");
    const couponRadios = document.querySelectorAll(".coupon-radio");
    const noCoupon = document.getElementById("noCoupon");

    function toggleCoupon() {
        if (useYes.checked) {
            couponList.style.display = "block";

            couponRadios.forEach(r => {
                r.disabled = false;
            });

        } else {
            couponList.style.display = "none";

            noCoupon.checked = true;

            couponRadios.forEach(r => {
                r.checked = false;
                r.disabled = true;
            });
        }
    }

    useYes.addEventListener("change", toggleCoupon);
    useNo.addEventListener("change", toggleCoupon);

    toggleCoupon();
</script>

</body>
</html>

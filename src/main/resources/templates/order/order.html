<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

    <div class="order-card">
        <h1 class="order-title">注文詳細 （<span th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd')}">yyyy/MM/dd</span>）</h1>
        
        <div class="items-list">
            <div class="item-container" th:each="item : ${cart}">
                <div class="item-image-box">商品画像</div>
                <div class="item-details">
                    <div class="product-name" th:text="'商品名 ' + ${item.name}">商品名 ~~~</div>
                    <div>単価 <span th:text="${#numbers.formatInteger(item.price, 1, 'COMMA')} + '円'">1000円</span></div>
                    <div>個数 <span th:text="${item.quantity} + '個'">3個</span></div>
                    <div class="item-price-total" th:text="'金額 ' + ${#numbers.formatInteger(item.price * item.quantity, 1, 'COMMA')} + '円'">金額 3000円</div>
                </div>
            </div>
        </div>

        <div class="total-section">
            <span class="total-label">合計金額</span>
            <span class="total-amount" th:text="${#numbers.formatInteger(totalPrice, 1, 'COMMA')} + '円 (税込)'">63000円 (税込)</span>
        </div>
        
        <div class="confirm-btn-container">
            <form th:action="@{/Comp}" method="get">
                <button type="submit" class="login-btn">購入を確定する</button>
            </form>
        </div>
    </div>

</body>
</html>

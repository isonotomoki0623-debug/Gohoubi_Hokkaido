<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>ユーザ登録</title>
	<!-- Bootstrap -->
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	    <!-- 本文フォント -->
	    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	    <!-- タイトル用 -->
		<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
		<link rel ="stylesheet" th:href="@{/css/sinkitouroku.css}">

</head>

<body>

	<main>
		<h1  class="login-title">ユーザ登録フォーム</h1>
		
		<form th:action="@{/register}" th:object="${form}" method="post" class="info-label">
		   <p>名前：<input type="text" th:field="*{name}" class="input-field"/>
		<span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"></span></p>
		   <p>メールアドレス：<input type="email" th:field="*{email}" class="input-field"/>
		<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></span></p>
		   <p>パスワード：<input type="password" th:field="*{password}" class="input-field"/>
		<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></span></p>
		   <p>好きなカテゴリー：
		   				<select th:field="*{job_id}" class="input-field">
							
		   					<option value="1">農作物</option>
		   					<option value="2">海産物</option>
		   					<option value="3">肉・畜産品</option>
		   					<option value="4">乳製品</option>
		   					<option value="5">スイーツ・お菓子</option>
		   					<option value="6">酒・飲料</option>
		   					<option value="7">消耗品</option>
		   				</select>
						<span th:if="${#fields.hasErrors('job_id')}" th:errors="*{job_id}" class="error-message"></span>
		   			</p>
		   			<p>お住まいの都道府県：
		   				<select th:field="*{prefectures_id}" class="input-field">
							
		   					<option value="1">北海道</option>
		   					<option value="2">東京</option>
		   				</select>
						<span th:if="${#fields.hasErrors('prefectures_id')}" th:errors="*{prefectures_id}" class="error-message"></span>
		   			</p>
		   <p><button type="submit" class="login-btn">登録</button></p>
		 </form>

		<a href="/" class="footer-link">▶ トップページへ戻る</a>
	</main>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ユーザ登録</title>

    <!-- CSS（ここ重要） -->
	<link rel="stylesheet" th:href="@{/css/sinkitouroku.css}" href="/css/sinkitouroku.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
</head>

<body>

<main class="main">

    <h1 style="text-align:center;">
        <img th:src="@{/images/logo_2.png}" alt="ごほうびほっかいどう" style="max-width:32%;" />
    </h1>

    <form th:action="@{/register}" th:object="${form}" method="post">

        <p class="info-label">名前</p>
        <input type="text" th:field="*{name}" class="input-field"/>
        <span th:errors="*{name}" class="error-message"></span>

        <p class="info-label">メールアドレス</p>
        <input type="email" th:field="*{email}" class="input-field"/>
        <span th:errors="*{email}" class="error-message"></span>

        <p class="info-label">パスワード</p>
        <input type="password" th:field="*{password}" class="input-field"/>
        <span th:errors="*{password}" class="error-message"></span>

        <p class="info-label">好きなカテゴリー</p>
        <select th:field="*{job_id}" class="input-field">
			<option value="0">選択</option>
            <option value="1">農作物</option>
            <option value="2">海産物</option>
            <option value="3">肉・畜産品</option>
            <option value="4">乳製品</option>
            <option value="5">スイーツ・お菓子</option>
            <option value="6">酒・飲料</option>
            <option value="7">消耗品</option>
        </select>
		<span th:errors="*{job_id}" class="error-message"></span>

        <p class="info-label">お住まいの都道府県</p>
        <select th:field="*{prefectures_id}" class="input-field">
			<option value="0">選択</option>
            <option value="1">北海道</option>
            <option value="2">東京</option>
        </select>
		<span th:errors="*{prefectures_id}" class="error-message"></span>

        <p style="margin-top:20px;">
            <button type="submit" class="login-btn">登録</button>
        </p>

    </form>

    <a href="/" class="footer-link">▶ トップページへ戻る</a>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>実績一覧 | ごほうびほっかいどう</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Yusei+Magic&display=swap"
		rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/achievement.css}">
	<link rel="stylesheet" th:href="@{/css/_header.css}">
</head>

<body>
	<header th:replace="layout/_header :: header"></header>
	<div class="container main-container">

		<br>
		<!-- タイトル -->
		<!--		<div class="hero-card mb-5">-->

		<!--			<h1 class="hero-title">-->
		<!--				🏆 実績コレクション-->
		<!--			</h1>-->

		<!--			<p class="hero-text">-->
		<!--				北海道を巡って、限定実績を集めよう！<br>-->

		<!--			</p>-->

		<!--		</div>-->
		<div class="reward-info-box">

			<h3>🎁 実績報酬ルール</h3>

			<ul>
				<li>
					⭐ 実績 <strong>5個</strong> 達成 → <span class="reward">5%クーポン</span>
				</li>

				<li>
					⭐ 実績 <strong>10個</strong> 達成 → <span class="reward">15%クーポン</span>
				</li>

				<li>
					⭐ 実績 <strong>15個</strong> 達成 → <span class="reward">20%クーポン</span>
				</li>
			</ul>

		</div>
		<!-- 実績一覧 -->
		<h2 class="section-title">
			⭐ 獲得実績一覧
		</h2>

		<div class="row g-4">

			<div class="achievement-list">

				<!-- 実績カード -->
				<div class="achievement-row" th:each="achievement : ${achievements}">

					<div th:class="${achievement.userId != null} ? 
			            'achievement-card unlocked' : 
			            'achievement-card locked'">

						<!-- 実績画像 -->
						<div class="achievement-image-wrap">

							<img th:src="${achievement.userId != null} ? 
			                @{${achievement.imagePath}} : @{/images/logo_2.png}" alt="実績画像">

						</div>

						<!-- 実績情報 -->
						<div class="achievement-info">

							<div class="achievement-badge">

								<span th:text="${achievement.userId != null} ? '獲得済み' : '未獲得'">
								</span>

							</div>

							<h3 class="achievement-name" th:text="${achievement.name}">
								実績名
							</h3>

							<p class="achievement-description" th:text="${achievement.description}">
								実績説明
							</p>

							<!-- 解放日 -->
							<p class="unlock-date" th:if="${achievement.unlockedAt != null}">

								アンロックした日：
								<span th:text="${#temporals.format(achievement.unlockedAt, 'yyyy/MM/dd')}">
								</span>

							</p>

							<!-- 未解放 -->
							<p class="unlock-date" th:if="${achievement.unlockedAt == null}">

								未解放

							</p>

						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

</body>

</html>

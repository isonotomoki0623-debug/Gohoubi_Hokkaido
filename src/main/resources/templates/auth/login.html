<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>ログイン</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 本文フォント -->
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
    <!-- タイトル用 -->
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
    <!-- 独自のCSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<header th:replace="layout/_header :: header"></header>
    <!-- Bootstrapのクラスで中央配置 -->
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-card col-12 col-md-6 col-lg-4">
            
<img th:src="@{/images/logo_2.png}" alt="Login Visual" class="login-header-img">            
            <!-- エラーメッセージ -->
            <p th:if="${loginError}" class="error-message text-center">[[${loginError}]]</p>

            <form th:action="@{/login}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="info-label">メールアドレス</label>
                    <input type="email" th:field="*{email}" class="input-field w-100" />
                    <span class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="mb-3">
                    <label class="info-label">パスワード</label>
                    <input type="password" th:field="*{password}" class="input-field w-100" />
                    <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>

                <div class="mt-4">
                    <button type="submit" class="login-btn w-100">ログイン</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="/register" class="footer-link">▶ 新規会員登録はこちら</a>
            </div>
            
        </div>
    </main>
</body>
</html>

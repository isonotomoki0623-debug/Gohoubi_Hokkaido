<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>会員情報変更</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<!-- CSS (既存のヘッダー用と、新しく作成するユーザーフォーム用のCSS) -->
	<link rel="stylesheet" th:href="@{/css/_header.css}">
	<link rel="stylesheet" th:href="@{/css/user-form.css}">
</head>

<body>
	<!-- 共通ヘッダーの埋め込み -->
	<header th:replace="layout/_header :: header"></header>

	<!-- 会員情報編集用のコンテナ（レビューフォームのデザインを踏襲） -->
	<div class="user-form-container">

		<h2 class="user-form-title">
			会員情報の変更
		</h2>

		<!-- ユーザー情報更新フォーム -->
		<form th:action="@{/update}" method="post" th:object="${user}">

			<!-- お名前入力エリア -->
			<div class="form-group">
				<label class="user-label">お名前</label>
				<input type="text" th:field="*{name}" class="user-input" placeholder="お名前を入力してください" required />
			</div>

			<!-- ボタンエリア -->
			<div class="button-group">
				<button type="submit" class="user-submit-button">
					変更を保存する
				</button>

				<!-- マイページや前画面に戻るためのキャンセルリンク（お好みで調整してください） -->
				<a th:href="@{/products}" class="user-cancel-link">戻る</a>
			</div>

		</form>

	</div>

</body>

</html>

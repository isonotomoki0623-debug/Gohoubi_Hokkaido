	<main class="main-container">

		<div class="container">

			<!-- 上段 -->
			<div class="row g-4 align-items-stretch">

				<!-- ヒーロー -->
				<div class="col-lg-8">

					<div class="hero-card">

						<h1 class="hero-title">
							北海道をめぐって、<br>
							ごほうびを集めよう。
						</h1>

						<p class="hero-text">
							商品を買うたびに実績解除。<br>
							エリアを集めて、北海道マスターを目指そう。
						</p>

						<div th:switch="${user?.job?.imagePath != null}">
							<!-- 真（true）の場合 -->
							<th:block th:case="true">
								<a th:href="@{/products}" class="btn btn-warning hero-btn">
									いってらっしゃい！
								</a>
							</th:block>

							<!-- 偽（false）の場合 -->
							<a th:href="@{/login}" th:case="false" class="btn btn-warning hero-btn">
								ログインして冒険を始める
							</a>
						</div>

					</div>

				</div>

				<!-- ステータス -->
				<div class="col-lg-4">

					<div class="status-card">

						<div class="level-box">

							<div class="level-title">
								Lv.12 北海道トラベラー
							</div>

							<div class="money-left">
								次のレベルまであと
								<strong>¥4,800</strong>
							</div>

							<div class="progress mt-3" style="height: 12px;">
								<div class="progress-bar bg-warning" style="width: 72%;"></div>
							</div>

						</div>

						<!-- ログインボーナス -->
						<div class="bonus-box">

							<div class="bonus-title">
								🎁 ログインボーナス
							</div>

							<div class="small">
								このセッション限定！<br>
								海鮮カテゴリ 全商品5%OFF
							</div>

						</div>

						<!-- 実績通知 -->
						<div class="achievement-alert">

							<div class="fw-bold mb-2">
								🏆 新しい実績を解除！
							</div>

							<div class="small text-muted">
								「スイーツ探検家」<br>
								スイーツカテゴリを5回購入
							</div>

						</div>

					</div>

				</div>

			</div>

			<section class="mt-5">

				<h2 class="section-title">
					⭐ おすすめ商品
				</h2>

				<div class="swiper mySwiper">

					<div class="swiper-wrapper">

						<div class="swiper-slide" th:each="product : ${recommendProducts}">

							<a th:href="@{/products/{id}(id=${product.id})}" class="product-link">

								<div class="product-card">

									<div class="product-image-wrap">

										<img th:src="${product.imagePath}" th:alt="${product.name}"
											class="product-image">

									</div>

									<div class="product-info">

										<div class="product-category" th:text="${product.productCategoryName}">
										</div>

										<h2 class="product-name" th:text="${product.name}">
										</h2>

										<p class="product-area" th:text="${product.hokkaidoAreaName}">
										</p>

										<div class="product-bottom">

											<div class="product-price">
												¥
												<span
													th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}"></span>
											</div>

											<div class="detail-button">
												詳細を見る
											</div>

										</div>

									</div>

								</div>

							</a>

						</div>

					</div>

					<div class="swiper-button-prev"></div>
					<div class="swiper-button-next"></div>

				</div>

			</section>


			<!-- 下段 -->
			<section class="mt-5">

				<div class="row g-4">

					<!-- 商品ランキング -->
					<div class="col-lg-6">

						<h2 class="section-title">
							👑 商品ランキング
						</h2>

						<div class="ranking-card">

							<div class="rank-item" th:each="product, stat : ${rankingProducts}">

								<div class="rank-number" th:text="${stat.count}">
									1
								</div>

								<div>

									<div class="rank-name" th:text="${product.name}">
										商品名
									</div>

									<div class="rank-sales">

										<span th:if="${stat.count == 1}">
											今週の人気 No.1
										</span>

										<span th:if="${stat.count == 2}">
											人気急上昇中
										</span>

										<span th:if="${stat.count == 3}">
											リピーター多数
										</span>

									</div>

								</div>

							</div>

						</div>

					</div>

					<!-- ユーザーランキング -->
					<div class="col-lg-6">

						<h2 class="section-title">
							👑 ユーザーランキング
						</h2>

						<div class="ranking-card">

							<div class="rank-item" th:each="user, stat : ${rankingUsers}">

								<div class="rank-number" th:text="${stat.count}">
									1
								</div>

								<div>

									<div class="rank-name" th:text="${user.name}">
										ユーザー名
									</div>

									<div class="rank-sales">

										<span th:if="${stat.count == 1}">
											北海道王
										</span>

										<span th:if="${stat.count == 2}">
											爆買い中
										</span>

										<span th:if="${stat.count == 3}">
											常連ユーザー
										</span>

									</div>

								</div>

							</div>

						</div>

					</div>

				</div>

			</section>

		</div>

	</main>

	<footer th:replace="layout/_footer :: footer"></footer>
